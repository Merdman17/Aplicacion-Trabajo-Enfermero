<style>
:root{
  --bg:#f3f5f7;--surface:#fff;--surface2:#e9edf1;--text:#17212b;--muted:#5f6b77;--line:#dbe1e7;
  --accent:#2a5d8f;--accent-ink:#fff;--accent-soft:#dce8f4;
  --red:#b93a2e;--red-soft:#f8e1de;--orange:#b86a0c;--orange-soft:#fbead3;--green:#2f7a4f;--green-soft:#dcefe3;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11161b;--surface:#1a2129;--surface2:#232c36;--text:#e6ecf1;--muted:#97a4b0;--line:#2d3743;
  --accent:#6ea6db;--accent-ink:#0c1620;--accent-soft:#1d3247;
  --red:#ef8a7e;--red-soft:#3d2220;--orange:#f0ad5b;--orange-soft:#3b2c18;--green:#7ccf9c;--green-soft:#1c3326;--shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 16px}
h1{font-size:21px;margin:0}
h2{font-size:17px;margin:20px 2px 8px}
h3{font-size:15px;margin:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:40px}
.top h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:10px;padding:9px 13px;background:var(--surface2);font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;color:var(--accent);padding:6px 8px}
.iconbtn{border:0;background:var(--surface);width:38px;height:38px;border-radius:10px;box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;flex:none;border-radius:999px;padding:7px 12px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap}
.t-venc{background:var(--red-soft);color:var(--red)}
.t-pend{background:var(--orange-soft);color:var(--orange)}
.t-prox{background:var(--orange-soft);color:var(--orange)}
.t-ok{background:var(--green-soft);color:var(--green)}
.t-sp{background:var(--surface2);color:var(--muted)}
.t-cat{background:var(--accent-soft);color:var(--accent)}
.banner{background:var(--accent-soft);color:var(--text);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.banner b{color:var(--accent)}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.datebar .lbl{flex:1;text-align:center;font-weight:700}
.task{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow);border-left:4px solid var(--accent)}
.task .tm{width:46px;flex:none;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.task .who{font-weight:700}
.task .what{font-size:14px;overflow-wrap:anywhere}
.task .sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.task.done{opacity:.55}
.task.done .what{text-decoration:line-through}
.task.other{box-shadow:none;background:transparent;border:1px dashed var(--line);border-left:4px solid var(--line)}
.ck{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;color:transparent;font-weight:900}
.task.done .ck{background:var(--green);border-color:var(--green);color:#fff}
details>summary{cursor:pointer;list-style:none;font-weight:700;margin:16px 2px 8px;color:var(--muted)}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'▸ ';}
details[open]>summary::before{content:'▾ ';}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bed{border:0;text-align:left;background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);min-height:64px;display:flex;flex-direction:column;gap:4px}
.bed .rn{font-weight:700;overflow-wrap:anywhere}
.bed .rm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item{padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.item .nm{font-weight:600;overflow-wrap:anywhere}
.item .dt{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item.ended{opacity:.5}
.sect{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;margin-bottom:10px}
.sect>.hd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sect>.hd h3{flex:1}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.ctl:first-of-type{border-top:0}
.ctl .nm{font-weight:600}
.ctl .dt{font-size:12.5px;color:var(--muted);grid-column:1/2;overflow-wrap:anywhere}
.ctl .act{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.grp{margin-bottom:10px}
.grp>.gh{font-weight:700;margin:12px 2px 6px;display:flex;gap:8px;align-items:baseline}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;font-size:16px}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13.5px}
.checks input{width:auto;margin:0}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
dialog{border:0;padding:0;background:transparent;width:100%;max-width:640px;margin:auto auto 0;max-height:100%}
dialog::backdrop{background:rgba(0,0,0,.45)}

@media (min-width:700px){dialog{margin:auto}.sheet{border-radius:20px}}

.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1}

nav.tabs button{flex:1;max-width:120px;border:0;background:transparent;padding:8px 1px 9px;font-size:10.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}

.toast.on{opacity:1;transform:translateX(-50%)}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;margin:8px 0}
.prog{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;margin:4px 0 12px}
.prog i{display:block;height:100%;background:var(--green)}
.hist{font-size:13px;border-top:1px solid var(--line);padding:7px 0;display:flex;gap:8px;align-items:center}
[hidden]{display:none!important}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lockbox{width:100%;max-width:340px;text-align:center}
.lockbox h1{margin:6px 0 4px}
.lockico{font-size:46px;line-height:1}
.lockbox input{text-align:center;margin:8px 0 2px;font-size:20px;letter-spacing:.25em}
.lockbox input::placeholder{letter-spacing:0;font-size:15px}
.lockbox .btn.primary{width:100%;padding:12px;margin-top:10px}
.lockbox .hint{text-align:left;margin:8px 2px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.c-cronico{border-left-color:#2a5d8f}.c-periodica{border-left-color:#7a55b8}.c-oxigeno{border-left-color:#2a9bb5}
.c-siesta{border-left-color:#8a8f3a}.c-agudo{border-left-color:#c2453a}.c-cura{border-left-color:#d0631e}
.c-glucemia{border-left-color:#b8327a}.c-peg{border-left-color:#3d8f5a}.c-dietoterapico{border-left-color:#6b8a2f}
.c-dieta{border-left-color:#6b726e}.c-general{border-left-color:#444}
.c-insulina{border-left-color:#1f9d8a}
nav.tabs button{position:relative}
.bdg{position:absolute;top:3px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;font-style:normal;font-size:10px;min-width:16px;padding:1px 4px;text-align:center;line-height:13px}
.ev{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev .ck{width:30px;height:30px}
.ev.pd{opacity:.5}
.ev.pd .ck{background:var(--green);border-color:var(--green);color:#fff}
.ev.pd .tx{text-decoration:line-through}
@media print{
  nav.tabs,.noprint,.top button,.chips,.datebar button{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card,.sect,.task{box-shadow:none;border:1px solid #ccc}
}
</style>

<script>
(function(){
'use strict';
/* ================= utilidades ================= */
var KEY='planta.v1';
function $(s,r){return (r||document).querySelector(s)}

function today(){return ymd(new Date())}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function fmt(s){if(!s)return '—';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2)}
var MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2800)}

/* ================= configuración ================= */
var MEALS={DE:'Desayuno',CO:'Comida',ME:'Merienda',CE:'Cena',AC:'Al acostar'};
var GLU=[
  {k:'AY',m:'DE',off:-90,label:'Ayunas'},
  {k:'aDE',m:'DE',off:-15,label:'Antes DE'},{k:'dDE',m:'DE',off:120,label:'Después DE'},
  {k:'aCO',m:'CO',off:-15,label:'Antes CO'},{k:'dCO',m:'CO',off:120,label:'Después CO'},
  {k:'aCE',m:'CE',off:-15,label:'Antes CE'},{k:'dCE',m:'CE',off:120,label:'Después CE'}];
var CATS={
  dieta:{l:'Dieta',name:'Textura',dose:null,detail:'Tipo y observaciones',sched:'none'},
  dietoterapico:{l:'Dietoterápicos',name:'Producto',dose:'Posología',detail:'Observaciones',sched:'none'},
  peg:{l:'Nutrición enteral (PEG)',name:'Producto',dose:'Volumen por toma',detail:'Agua / indicaciones',sched:'daily'},
  cronico:{l:'Tratamientos crónicos',name:'Fármaco',dose:'Dosis',detail:'Pauta / vía',sched:'daily',subs:['Inhalador','Jarabe / gotas','Parche','Colirio','Pomada','Otro']},
  periodica:{l:'Otras pautas periódicas',name:'Fármaco',dose:'Dosis',detail:'Vía / indicaciones',sched:'mdays'},
  insulina:{l:'Insulinas',name:'Insulina',dose:'Dosis / pauta',detail:'Observaciones',sched:'daily'},
  oxigeno:{l:'Oxigenoterapia',name:'Dispositivo',dose:'Flujo',detail:'Pauta',sched:'daily'},
  glucemia:{l:'Perfiles glucémicos',name:'Perfil',dose:null,detail:'Observaciones',sched:'weekdays'},
  cura:{l:'Curas',name:'Localización',dose:'Tipo / estadio',detail:'Procedimiento y material',sched:'everyN'},
  siesta:{l:'Pauta de siestas',name:'Pauta',dose:null,detail:'Detalle',sched:'daily'},
  agudo:{l:'Tratamientos agudos',name:'Fármaco',dose:'Dosis',detail:'Pauta / vía / motivo',sched:'daily'},
  general:{l:'Tareas generales',name:'Tarea',dose:null,detail:'Detalle',sched:'mdays',general:true}
};
var CAT_ORDER=['dieta','dietoterapico','peg','cronico','periodica','insulina','oxigeno','glucemia','cura','siesta','agudo'];
var BASE_ORDER=CAT_ORDER.slice(),GEN_ORDER=['general'],CATS0=JSON.parse(JSON.stringify(CATS));
function syncCats(list,over){
  Object.keys(CATS).forEach(function(k){if(k.indexOf('x_')===0)delete CATS[k]});
  Object.keys(CATS0).forEach(function(k){CATS[k]=Object.assign({},CATS0[k]);var o=over&&over[k];if(o){if(o.l)CATS[k].l=o.l;if(o.name)CATS[k].name=o.name;if(o.detail)CATS[k].detail=o.detail;if(o.dose!==undefined)CATS[k].dose=o.dose||null}});
  CAT_ORDER.length=0;BASE_ORDER.forEach(function(k){CAT_ORDER.push(k)});GEN_ORDER.length=0;GEN_ORDER.push('general');
  (list||[]).forEach(function(c){
    CATS[c.id]={l:c.l,name:c.name||'Nombre',dose:c.dose?'Dosis':null,detail:c.detail||'Detalle',sched:'none',general:!!c.general,custom:true};
    (c.general?GEN_ORDER:CAT_ORDER).push(c.id)});
}
function allCats(){return CAT_ORDER.concat(GEN_ORDER)}
function defSettings(){return{title:'Planta 5',shiftStart:'07:30',shiftEnd:'15:00',meals:{DE:'09:00',CO:'13:00',ME:'17:00',CE:'19:30',AC:'21:00'},hoyCats:{oxigeno:false,siesta:false,cronico:false,peg:false},selFloors:null}}
function defControls(){return[
  {id:'mna',name:'MNA completo',months:6,monthsMal:3,shortMal:true,kind:'mna',unit:'Puntuación'},
  {id:'norton',name:'Norton',months:6,kind:'norton',unit:'Puntuación'},
  {id:'cfr',name:'CFR',months:6,unit:'Resultado'},
  {id:'peso',name:'Peso',months:6,monthsMal:3,shortMal:true,unit:'kg'},
  {id:'cv',name:'Constantes (TA, FC, SatO₂)',months:1,unit:'TA / FC / SatO₂'},
  {id:'gluc',name:'Glucemia',months:6,unit:'mg/dl'}]}
function emptyDB(){return{v:1,settings:defSettings(),controls:defControls(),residents:[],records:[],open:[],pautas:[],done:{},custom:[],catOver:{},log:[],mig:2}}
function normalize(d){
  var e=emptyDB();d=d&&typeof d==='object'?d:{};
  ['residents','records','open','pautas'].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[]});
  if(!d.done||typeof d.done!=='object')d.done={};
  if(!d.catOver||typeof d.catOver!=='object')d.catOver={};
  syncCats(Array.isArray(d.custom)?d.custom:(d.custom=[]),d.catOver);
  if(!Array.isArray(d.log))d.log=[];
  d.settings=Object.assign(e.settings,d.settings||{});d.settings.meals=Object.assign(defSettings().meals,d.settings.meals||{});
  d.settings.hoyCats=Object.assign({oxigeno:false,siesta:false,cronico:false,peg:false},d.settings.hoyCats||{});if(!Array.isArray(d.settings.selFloors))d.settings.selFloors=null;
  if(!Array.isArray(d.controls)||!d.controls.length)d.controls=e.controls;
  d.pautas.forEach(function(p){p.sched=p.sched||{type:'none'};p.slots=Array.isArray(p.slots)?p.slots:[];if(!CATS[p.cat])p.cat='agudo'});
  d.residents.forEach(function(r){if(r.active===undefined)r.active=true;r.name=r.name||'';r.info=r.info||''});
  if(!(d.mig>=2)){d.pautas.forEach(function(p){if(p.cat==='cronico'&&p.sub==='Parche'&&p.sched&&p.sched.type==='daily'&&p.hoy===undefined)p.hoy=false});d.mig=2}
  d.v=1;return d;
}

/* ================= almacenamiento y cifrado ================= */
var ENC='planta.enc',NOPIN='planta.nopin',LOCKMIN='planta.lockmin',ITER=600000;
var db=normalize(null),key=null,meta=null,locked=false,subtle=!!(window.crypto&&crypto.subtle);
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function deriveKey(pin,salt,iter){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']).then(function(km){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])})}

  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(str)).then(function(ct){return b64(iv)+'.'+b64(ct)})}

  return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p[0])},k,unb64(p[1])).then(function(pt){return new TextDecoder().decode(pt)})}
function blobOf(m,data){return JSON.stringify({v:1,iter:m.iter,salt:m.salt,data:data})}
var chain=Promise.resolve();
function save(){
  if(locked)return;
  var lim=addDays(today(),-120);

/* ================= agenda (motor de pautas) ================= */
function wday(s){return ((parse(s).getDay()+6)%7)+1}
function occurs(p,s){
  var c=p.sched||{};
  if(c.start&&s<c.start&&c.type!=='months'&&c.type!=='everyN'&&c.type!=='once')return false;
  if(c.end&&s>c.end)return false;
  switch(c.type){
    case 'daily':return true;
    case 'weekdays':return (c.days||[]).indexOf(wday(s))>=0;
    case 'mdays':return (c.mdays||[]).indexOf(parse(s).getDate())>=0;
    case 'everyN':{if(!c.start||s<c.start)return false;var n=Math.max(1,c.n||1);return diffDays(c.start,s)%n===0}
    case 'months':{if(!c.start||s<c.start)return false;var a=parse(c.start),b=parse(s),n2=Math.max(1,c.n||1);
      var md=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(md%n2)return false;
      return b.getDate()===Math.min(a.getDate(),lastDay(b.getFullYear(),b.getMonth()))}
    case 'once':return s===c.start;
    default:return false;
  }
}
function nextOcc(p,from){
  var c=p.sched||{};if(c.type==='none'||p.sp)return '';
  if(c.type==='months'&&c.start){var s=c.start,i=0;while(s<from&&i<500){i++;s=addMonths(c.start,(c.n||1)*i)}return (!c.end||s<=c.end)?s:''}
  for(var k=0;k<400;k++){var d=addDays(from,k);if(c.end&&d>c.end)return '';if(occurs(p,d))return d}
  return '';
}
function schedText(p){

    case 'daily':t='Todos los días';break;
    case 'weekdays':t=(c.days||[]).slice().sort().map(function(d){return WD[d-1]}).join(', ')||'Ningún día';break;
    case 'mdays':t='Día'+((c.mdays||[]).length>1?'s ':' ')+(c.mdays||[]).join(' y ')+' de cada mes';break;
    case 'everyN':t='Cada '+(c.n||1)+' días'+(c.start?' desde '+fmt(c.start):'');break;
    case 'months':t='Cada '+(c.n||1)+(c.n===1?' mes':' meses');break;
    case 'once':t='El '+fmt(c.start);break;

      else{if(!confirm('La cama '+room+' está ocupada por '+rname(other)+'. ¿Intercambiar las camas?'))return false;other.room=r.room}

  });

    $('#bajaBtn').onclick=function(){
      if(r.active){if(!confirm('¿Dar de baja a '+rname(r)+'? Su historial se conserva en "Ver bajas".'))return;r.active=false;r.bajaDate=today()}
      else{var o=db.residents.find(function(x){return x.active&&x.room===r.room});if(o){toast('La cama está ocupada; cambia antes la habitación');return}r.active=true;delete r.bajaDate}
      save();dlg.close();render();
    };

      if(!confirm('¿Eliminar definitivamente a '+rname(r)+' y todo su historial? No se puede deshacer.'))return;

      db.open=db.open.filter(function(x){return x.rid!==r.id});db.residents=db.residents.filter(function(x){return x!==r});

  }

function floorOf(r){return (String(r.room).match(/^(\d+)[.\-]/)||[])[1]||''}
function floorsList(){var o={};db.residents.forEach(function(r){if(r.active){var f=floorOf(r);if(f)o[f]=1}});return Object.keys(o).sort()}
function floorRes(r){var s=db.settings.selFloors;return !s||!s.length||s.indexOf(floorOf(r))>=0}
function floorOK(p){if(!p.rid)return true;var r=R(p.rid);return !!r&&floorRes(r)}
function hoyOn(p){if(p.hoy===true)return true;if(p.hoy===false)return false;return db.settings.hoyCats[p.cat]!==false}
function normRoom(s){var m=s.match(/^(\d{1,2})[.\-]?([A-Z])[.\-]?(\d{1,2})[.\-]?(\d)$/);return m?pad(+m[1])+'.'+m[2]+'.'+pad(+m[3])+'.'+m[4]:''}
function addLog(o){var n=new Date();o.id=uid('l');o.time=pad(n.getHours())+':'+pad(n.getMinutes());o.passed=false;db.log.push(o)}
function logUndo(k){db.log=db.log.filter(function(l){return l.key!==k})}
function logDone(k){
  var a=k.split('|'),p=db.pautas.find(function(x){return x.id===a[0]});if(!p||db.log.some(function(l){return l.key===k}))return;
  var sl=p.slots&&p.slots[+a[2]],st=sl?slotText(sl):'';
  var txt=p.evo||((p.cat==='cura'?'Cura ':'')+(p.cat==='cronico'&&p.sub?p.sub+' ':'')+p.name+(p.dose?' '+p.dose:''));
  addLog({key:k,date:a[1],rid:p.rid,cat:p.cat,text:txt+(st?' ('+st+')':'')});
}
function evoGroups(list){
  var byD={};list.forEach(function(l){(byD[l.date]=byD[l.date]||[]).push(l)});
  return Object.keys(byD).sort().reverse().map(function(d){
    var byR={},order=[];byD[d].sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:0}).forEach(function(l){var k=l.rid||'_';if(!byR[k]){byR[k]=[];order.push(k)}byR[k].push(l)});
    order.sort(function(a,b){var ra=a==='_'?'~':(R(a)||{room:'~'}).room,rb=b==='_'?'~':(R(b)||{room:'~'}).room;return ra<rb?-1:ra>rb?1:0});
    return{date:d,res:order.map(function(k){return{rid:k==='_'?null:k,items:byR[k]}})}});
}

    case 'newBeds':bulkBeds();break;
    case 'reloadApp':location.reload();break;
    case 'wipe':if(confirm('¿Borrar TODOS los datos de este dispositivo? Haz antes una copia si la necesitas.')&&confirm('Seguro. No se puede deshacer.')){db=normalize(null);save();render();toast('Todo borrado')}break;
  }
});
document.addEventListener('toggle',function(e){if(e.target.matches&&e.target.matches('[data-act=dueToggle]'))ctx.openDue=e.target.open},true);
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.in==='q'){ctx.q=el.value;var r=$('#results');if(r)r.innerHTML=view==='res'?resResults():listResults()}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.lock!==undefined){try{localStorage.setItem(LOCKMIN,el.value)}catch(x){}toast('Guardado')}
  if(el.dataset.hoycat){db.settings.hoyCats[el.dataset.hoycat]=el.checked;save();toast('Guardado')}
  if(el.dataset.set){db.settings[el.dataset.set]=el.value;save();toast('Guardado')}
  if(el.dataset.meal){if(el.value){db.settings.meals[el.dataset.meal]=el.value;save();toast('Guardado')}}
});

/* ================= copia / importación ================= */
var noLockUntil=0;
function download(text,name){
  var blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
}
function exportData(){
  noLockUntil=Date.now()+90000;
  var payload=JSON.stringify({app:'planta5',v:1,exported:today(),db:db});
  if(key){
    var k=key,m=meta;
    chain=chain.then(function(){return encStr(k,payload)}).then(function(d){
      download(JSON.stringify({app:'planta5',enc:1,v:1,iter:m.iter,salt:m.salt,data:d}),'planta-copia-cifrada-'+today()+'.json');
      toast('Copia cifrada descargada. Solo se abre con tu PIN actual.');
    }).catch(function(){toast('No se ha podido crear la copia')});
  }else{
    download(JSON.stringify({app:'planta5',v:1,exported:today(),db:db},null,1),'planta-copia-'+today()+'.json');
    toast('Copia descargada SIN cifrar. Contiene los nombres: guárdala en sitio seguro.');
  }
}
function applyImport(d){
  if(!d||!Array.isArray(d.residents))throw 0;
  if(!confirm('Se van a cargar '+d.residents.length+' residentes y '+((d.pautas||[]).length)+' pautas. Esto SUSTITUYE lo que hay ahora en el móvil. ¿Seguir?'))return;
  var keepSet=db.settings,keepC=db.controls;
  db=normalize(d);if(!d.settings)db.settings=keepSet;if(!d.controls)db.controls=keepC;
  save();go('hoy');toast('Datos cargados');
}
function importEnc(j){
  openDlg('<h3>Copia cifrada</h3><p class="muted small">Escribe el PIN con el que se hizo la copia.</p>'+
    '<input type="password" name="cur" inputmode="numeric" autocomplete="off" required>'+
    '<div class="actions"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary">Abrir</button></div>',function(f){
    deriveKey(f.elements.cur.value,unb64(j.salt),j.iter).then(function(k){return decStr(k,j.data)}).then(function(t){
      var o=JSON.parse(t);dlg.close();try{applyImport(o.db)}catch(x){toast('Ese archivo no es válido')}
    }).catch(function(){toast('PIN incorrecto o copia dañada')});
    return false;
  });
}
$('#fileIn').onchange=function(){
  var file=this.files&&this.files[0];this.value='';if(!file)return;
  file.text().then(function(t){
    var j=JSON.parse(t);
    if(j&&j.enc){if(!subtle)throw 0;importEnc(j);return}
    applyImport(j&&j.db);
  }).catch(function(){toast('Ese archivo no es válido')});
};

/* ---- diálogos de PIN (activar / cambiar / quitar) ---- */
function pinDlg(kind){
  var h='<h3>'+({set:'Activar PIN',change:'Cambiar PIN',remove:'Quitar PIN'}[kind])+'</h3>';
  if(kind==='remove')h+='<div class="note">Al quitar el PIN, los datos dejarán de estar cifrados en este móvil.</div>';
  if(kind!=='set')h+='<label class="f">PIN actual</label><input type="password" name="cur" inputmode="numeric" autocomplete="off" required>';
  if(kind!=='remove')h+='<label class="f">'+(kind==='change'?'PIN nuevo':'PIN')+' (mínimo 6; mejor 8 o más, o con letras)</label><input type="password" name="p1" inputmode="numeric" autocomplete="off" required>'+
    '<label class="f">Repítelo</label><input type="password" name="p2" inputmode="numeric" autocomplete="off" required>'+
    '<div class="hint"><b>Si olvidas el PIN no hay forma de recuperar los datos del móvil</b>: habría que cargarlos de nuevo desde una copia.</div>';
  h+='<div class="actions"><button type="button" class="btn ghost" id="kbT">Teclado con letras</button></div>'+
    '<div class="actions"><button type="button" class="btn" data-close>Cancelar</button><button class="btn '+(kind==='remove'?'danger':'primary')+'">'+(kind==='remove'?'Quitar PIN':'Guardar')+'</button></div>';
  openDlg(h,function(f){
    var cur=f.elements.cur?f.elements.cur.value:'',a=f.elements.p1?f.elements.p1.value:'',b=f.elements.p2?f.elements.p2.value:'';
    if(kind!=='remove'){var m=pinErr(a,b);if(m){toast(m);return false}}
    (kind==='set'?Promise.resolve(true):checkPin(cur)).then(function(ok){
      if(!ok){toast('PIN actual incorrecto');return}
      if(kind==='remove')return removePinNow().then(function(){dlg.close();render();toast('PIN quitado: los datos ya no están cifrados')});
      return setPin(a).then(function(){dlg.close();render();toast(kind==='set'?'PIN activado: datos cifrados':'PIN cambiado')});
    }).catch(function(){toast('No se ha podido completar')});
    return false;
  });
  $('#kbT').onclick=function(){var ins=$$('#df input[type=password]'),num=ins[0].inputMode==='numeric';ins.forEach(function(i){i.inputMode=num?'text':'numeric';i.blur()});this.textContent=num?'Teclado numérico':'Teclado con letras';ins[0].focus()};
}

/* ================= arranque ================= */
var lastDay0=today(),updReady=false;
var hiddenAt=0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();return}
  if(locked)return;
  if(key&&Date.now()>noLockUntil&&Date.now()-hiddenAt>=lockMin()*60000){lock();return}
  var t=today();if(t!==lastDay0){if(ctx.date===lastDay0)ctx.date=t;lastDay0=t}if(!dlg.open)render();
});
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist()}catch(x){}}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  var hadCtl=!!navigator.serviceWorker.controller;
  var swUpd=function(r){if(r)r.update().catch(function(){})};
  navigator.serviceWorker.register('sw.js').then(swUpd).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(!hadCtl){hadCtl=true;return}updReady=true;if(!locked&&!dlg.open)render()});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)navigator.serviceWorker.getRegistration().then(swUpd).catch(function(){})});
}
boot();
})();
</script>
